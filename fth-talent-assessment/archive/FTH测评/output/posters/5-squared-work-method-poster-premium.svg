      <line x1="84" y1="906" x2="996" y2="906" stroke="#D8D0B7" stroke-width="1"/>
      <text x="84" y="948" font-family="PingFang SC, Noto Sans SC, Arial" font-size="22" font-weight="700" fill="#7A5B39" text-anchor="start" opacity="1" letter-spacing="0">04</text>
