  <g>
    <text x="84" y="1214" font-family="PingFang SC, Noto Sans SC, Arial" font-size="30" font-weight="750" fill="#161614" text-anchor="start" opacity="1" letter-spacing="0">不是更多事项，而是更少、更准、更持续的动作。</text>
