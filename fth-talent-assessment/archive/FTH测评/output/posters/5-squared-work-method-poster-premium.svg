  <text x="86" y="411" font-family="PingFang SC, Noto Sans SC, Arial" font-size="42" font-weight="800" fill="#161614" text-anchor="start" opacity="1" letter-spacing="0">百万年薪顾问每日工作清单</text>
  <text x="86" y="466" font-family="PingFang SC, Noto Sans SC, Arial" font-size="25" font-weight="500" fill="#716B5C" text-anchor="start" opacity="1" letter-spacing="0">Meet the better you</text>

