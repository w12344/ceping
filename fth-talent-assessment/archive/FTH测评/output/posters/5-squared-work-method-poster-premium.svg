      <text x="776" y="832" font-family="PingFang SC, Noto Sans SC, Arial" font-size="18" font-weight="500" fill="#716B5C" text-anchor="start" opacity="1" letter-spacing="0">HIGH VALUE LEADS</text>
    </g>
  
