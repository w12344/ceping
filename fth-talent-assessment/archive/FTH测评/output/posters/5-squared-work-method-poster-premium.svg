<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1440" viewBox="0 0 1080 1440">
  <defs>
    <linearGradient id="wash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity=".72"/>
      <stop offset="1" stop-color="#FFE200" stop-opacity=".20"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency=".9" numOctaves="2" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feComponentTransfer>
        <feFuncA type="table" tableValues="0 .055"/>
      </feComponentTransfer>
    </filter>
  </defs>

  <rect width="1080" height="1440" fill="#F6F1DD"/>
  <rect width="1080" height="1440" fill="url(#wash)"/>
  <rect width="1080" height="1440" filter="url(#grain)" opacity=".65"/>

  <rect x="0" y="0" width="22" height="1440" fill="#FFE200"/>
  <rect x="84" y="84" width="912" height="1" fill="#D8D0B7"/>
  <rect x="84" y="1280" width="912" height="1" fill="#D8D0B7"/>

  <image href="data:image/png;base64," x="84" y="112" width="176" height="57" preserveAspectRatio="xMinYMin meet"/>
  <text x="996" y="146" font-family="PingFang SC, Noto Sans SC, Arial" font-size="20" font-weight="700" fill="#716B5C" text-anchor="end" opacity="1" letter-spacing="0">TO DO LIST</text>

  <text x="84" y="346" font-family="PingFang SC, Noto Sans SC, Arial" font-size="220" font-weight="800" fill="#161614" text-anchor="start" opacity="1" letter-spacing="0">5</text>
  <text x="218" y="244" font-family="PingFang SC, Noto Sans SC, Arial" font-size="68" font-weight="700" fill="#161614" text-anchor="start" opacity="1" letter-spacing="0">2</text>
